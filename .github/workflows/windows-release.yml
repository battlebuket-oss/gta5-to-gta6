name: Windows release package

on:
  push:
    branches:
      - "feature/**"
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (for example 0.1.0-preview.1)"
        required: true
        default: "0.1.0-preview.1"
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SIGNING_CONFIGURED: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' && secrets.WINDOWS_SIGNING_PFX_PASSWORD != '' }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?) {
            throw "Invalid semantic version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Validate mod catalogue and approval gates
        shell: pwsh
        run: ./scripts/Validate-Catalogue.ps1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/GtaTransformationHub.Tests/GtaTransformationHub.Tests.csproj

      - name: Build with warnings as errors
        run: dotnet build src/GtaTransformationHub/GtaTransformationHub.csproj --configuration Release --no-restore -warnaserror

      - name: Run automated tests
        run: dotnet test tests/GtaTransformationHub.Tests/GtaTransformationHub.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/GtaTransformationHub/GtaTransformationHub.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = "artifacts/win-x64/GtaTransformationHub.exe"
          if (!(Test-Path $exe)) { throw "Expected Windows application executable is missing: $exe" }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Executable exists. Current signature status: $($sig.Status)"
          if ((Get-Item $exe).Length -lt 100KB) { throw "Published executable is unexpectedly small." }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Sign application and installer when certificate is configured
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $isTag = "${{ github.ref_type }}" -eq "tag"
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            if ($isTag) { throw "A tagged public release requires WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD secrets." }
            Write-Warning "No signing certificate configured. This is an UNSIGNED development installer, not a production release."
            return
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $securePassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $importedCerts = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword)
            $cert = $importedCerts |
              Where-Object {
                $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) -and
                @($_.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value }) -contains "1.3.6.1.5.5.7.3.3"
              } |
              Select-Object -First 1
            if ($null -eq $cert) { throw "A valid, unexpired code-signing certificate with a private key is required." }
            $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            $signtool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool.exe } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (!$signtool) { throw "Windows SDK signtool.exe was not found." }

            & $signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $cert.Thumbprint /s My "artifacts/win-x64/GtaTransformationHub.exe"
            if ($LASTEXITCODE -ne 0) { throw "Signing the application executable failed." }
            & $signtool verify /pa /v "artifacts/win-x64/GtaTransformationHub.exe"
            if ($LASTEXITCODE -ne 0) { throw "Application signature verification failed." }
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer/GtaTransformationHub.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Sign installer when certificate is configured
        if: env.SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $securePassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $importedCerts = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword)
            $cert = $importedCerts |
              Where-Object {
                $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) -and
                @($_.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value }) -contains "1.3.6.1.5.5.7.3.3"
              } |
              Select-Object -First 1
            if ($null -eq $cert) { throw "A valid, unexpired code-signing certificate with a private key is required." }
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\\\x64\\\\signtool.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            $installer = Get-ChildItem artifacts/installer -Filter "*.exe" | Select-Object -First 1
            if (!$installer) { throw "Installer output missing." }
            & $signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $cert.Thumbprint /s My $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed." }
            & $signtool verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem artifacts/win-x64 -File -Recurse
            Get-ChildItem artifacts/installer -File -Recurse
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.FullName.Replace('artifacts/',''))"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8

