name: Windows build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-\${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore test and application dependencies
        run: dotnet restore tests/GtaTransformationHub.Tests/GtaTransformationHub.Tests.csproj

      - name: Build application
        run: dotnet build src/GtaTransformationHub/GtaTransformationHub.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/GtaTransformationHub.Tests/GtaTransformationHub.Tests.csproj --configuration Release --no-restore

      - name: Publish Windows x64 application
        run: dotnet publish src/GtaTransformationHub/GtaTransformationHub.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/win-x64

      - name: Upload Windows x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta-transformation-hub-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14
